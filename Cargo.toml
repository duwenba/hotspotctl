[package]
name = "hotspotctl"
version = "0.1.1"
edition = "2021"
description = "Linux 便携热点管理器 (NetworkManager + UFW, Rust TUI/CLI)"
repository = "https://github.com/duwenba/hotspotctl"
authors = ["Du Wenba <2275317692@qq.com>"]
keywords = ["hotspot", "networkmanager", "tui", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "hotspotctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
regex = "1"

[profile.release]
strip = true